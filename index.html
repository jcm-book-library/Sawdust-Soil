*{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

<script>
(function(){
'use strict';
var PAGES=['today','garden','workshop','list'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var THIN=' ';
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function seasonOf(m){return (m>=11||m<=1)?'summer':m<=4?'autumn':m<=7?'winter':'spring'}
function ce(x){return Math.ceil(x-1e-9)}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function r1(x){return Math.round(x*10)/10}

/* storage */
var mem={};
function lsGet(k,d){try{var v=localStorage.getItem('ss_'+k);if(v!==null)return JSON.parse(v)}catch(e){}return (k in mem)?mem[k]:d}
var syncHook=function(){};
function lsSet(k,v){mem[k]=v;try{localStorage.setItem('ss_'+k,JSON.stringify(v))}catch(e){}try{syncHook(k)}catch(e){}}
function lsHas(k){try{if(localStorage.getItem('ss_'+k)!==null)return true}catch(e){}return k in mem}

/* formatting */
function fmm(v){var n=Math.round(+v);if(!isFinite(n))return '0';var s=String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,THIN);return n<0?'-'+s:s}
function fm(v){v=+v;if(!isFinite(v))return '0';var s=Math.abs(v)>=10?v.toFixed(1):v.toFixed(2);return s.replace(/\.(\d)0$/,'.$1').replace(/\.0$/,'')}
function money(v){v=Math.round(+v);if(!isFinite(v))v=0;return '$'+String(v).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function dims(l,w,t){return fmm(l)+' × '+fmm(w)+' × '+fmm(t)}

/* packing */
function pack(pieces,stock,kerf){
  if(kerf==null)kerf=3;
  var items=[];
  pieces.forEach(function(p){var q=Math.max(0,Math.floor(+p.qty||0));for(var i=0;i<q;i++)items.push({len:+p.len,label:p.label})});
  items.sort(function(a,b){return b.len-a.len});
  var bins=[];
  items.forEach(function(it){
    if(it.len>stock){bins.push({stock:stock,items:[it],used:it.len,over:true});return}
    var tgt=null;
    for(var i=0;i<bins.length;i++){var b=bins[i];if(!b.over&&b.used+kerf+it.len<=stock){tgt=b;break}}
    if(tgt){tgt.items.push(it);tgt.used+=kerf+it.len}
    else bins.push({stock:stock,items:[it],used:it.len,over:false});
  });
  return bins;
}
function bestStock(pieces,options,kerf){
  if(kerf==null)kerf=3;
  var best=null;
  options.forEach(function(s){
    var bins=pack(pieces,s,kerf);
    if(bins.some(function(b){return b.over}))return;
    var total=bins.length*s;
    if(!best||total<best.total||(total===best.total&&bins.length<best.bins.length))best={stock:s,bins:bins,total:total};
  });
  if(!best){var s=Math.max.apply(null,options);var bins=pack(pieces,s,kerf);best={stock:s,bins:bins,total:bins.length*s,over:true}}
  return best;
}
function labelIdx(s){var h=0;for(var i=0;i<s.length;i++)h=(h+s.charCodeAt(i))%4;return h}
function planHTML(pl){
  var stock=pl.stock;
  var rows=pl.bins.map(function(b,i){
    var tot=0;
    var segs=b.items.map(function(it){
      var pct=Math.min(100,it.len/stock*100);tot+=pct;
      return '<div class="seg s'+labelIdx(it.label)+(b.over?' over':'')+'" style="flex:0 0 '+pct.toFixed(3)+'%" title="'+esc(it.label)+' '+fmm(it.len)+' mm">'+(pct>9?'<span>'+esc(it.label)+' '+fmm(it.len)+'</span>':'')+'</div>';
    }).join('');
    var w=Math.max(0,100-tot);
    return '<div class="bin"><span class="bn">'+(i+1)+'</span><div class="bar" role="img" aria-label="Piece '+(i+1)+' cutting layout">'+segs+(w>0.01?'<div class="seg waste" style="flex:0 0 '+w.toFixed(3)+'%"></div>':'')+'</div></div>';
  }).join('');
  return '<div class="plan"><div class="pc"><b>'+esc(pl.title)+'</b><br>'+pl.caption+'</div>'+rows+'</div>';
}

/* SVG sheet */
var PID=0;
function Sheet(wmm,hmm){
  wmm=Math.max(1,+wmm||1);hmm=Math.max(1,+hmm||1);
  var pad=60,VW=680;
  var VH=Math.max(240,Math.min(560,2*pad+560*hmm/wmm));
  var s=Math.min((VW-2*pad)/wmm,(VH-2*pad)/hmm);
  var ox=pad+((VW-2*pad)-wmm*s)/2,oy=pad+((VH-2*pad)-hmm*s)/2;
  var X=function(v){return ox+v*s},Y=function(v){return VH-oy-v*s};
  var out=[],defs=[],have={},id=++PID;
  var f=function(n){return Math.round(n*100)/100};
  var o={X:X,Y:Y,s:s,VH:VH};
  o.rect=function(x,y,w,h,cls,fill){out.push('<rect x="'+f(X(x))+'" y="'+f(Y(y+h))+'" width="'+f(Math.max(0,w*s))+'" height="'+f(Math.max(0,h*s))+'" class="'+(cls||'pc')+'"'+(fill?' fill="'+fill+'"':'')+'/>')};
  o.line=function(x1,y1,x2,y2,cls){out.push('<line x1="'+f(X(x1))+'" y1="'+f(Y(y1))+'" x2="'+f(X(x2))+'" y2="'+f(Y(y2))+'" class="'+(cls||'ln')+'" fill="none"/>')};
  o.poly=function(pts,cls,fill){out.push('<polygon points="'+pts.map(function(p){return f(X(p[0]))+','+f(Y(p[1]))}).join(' ')+'" class="'+(cls||'pc')+'"'+(fill?' fill="'+fill+'"':'')+'/>')};
  o.circle=function(cx,cy,r,cls,px){out.push('<circle cx="'+f(X(cx))+'" cy="'+f(Y(cy))+'" r="'+f(px?r:r*s)+'" class="'+cls+'"/>')};
  o.ellipse=function(cx,cy,rx,ry,cls){out.push('<ellipse cx="'+f(X(cx))+'" cy="'+f(Y(cy))+'" rx="'+f(rx*s)+'" ry="'+f(ry*s)+'" class="'+cls+'"/>')};
  o.text=function(x,y,str,cls,anchor,dx,dy){out.push('<text x="'+f(X(x)+(dx||0))+'" y="'+f(Y(y)+(dy||0))+'" class="'+(cls||'lbl')+'" text-anchor="'+(anchor||'middle')+'" fill="currentColor" style="fill:var(--muted)">'+esc(str)+'</text>')};
  o.dimH=function(x1,x2,y,label,off){
    off=off==null?28:off;
    var a=X(x1),b=X(x2),y0=Y(y),yy=y0+off,e=off>=0?4:-4,g=off>=0?3:-3;
    out.push('<g><line class="dim" x1="'+f(a)+'" y1="'+f(y0+g)+'" x2="'+f(a)+'" y2="'+f(yy+e)+'"/><line class="dim" x1="'+f(b)+'" y1="'+f(y0+g)+'" x2="'+f(b)+'" y2="'+f(yy+e)+'"/><line class="dim" x1="'+f(a)+'" y1="'+f(yy)+'" x2="'+f(b)+'" y2="'+f(yy)+'"/><line class="dim" x1="'+f(a-4)+'" y1="'+f(yy+4)+'" x2="'+f(a+4)+'" y2="'+f(yy-4)+'"/><line class="dim" x1="'+f(b-4)+'" y1="'+f(yy+4)+'" x2="'+f(b+4)+'" y2="'+f(yy-4)+'"/><text class="lbl" x="'+f((a+b)/2)+'" y="'+f(yy-5)+'" text-anchor="middle" style="fill:var(--muted)">'+esc(label)+'</text></g>');
  };
  o.dimV=function(y1,y2,x,label,off){
    off=off==null?28:off;
    var a=Y(y1),b=Y(y2),x0=X(x),xx=x0+off,e=off>=0?4:-4,g=off>=0?3:-3;
    var tx=off>=0?xx+14:xx-5;
    out.push('<g><line class="dim" x1="'+f(x0+g)+'" y1="'+f(a)+'" x2="'+f(xx+e)+'" y2="'+f(a)+'"/><line class="dim" x1="'+f(x0+g)+'" y1="'+f(b)+'" x2="'+f(xx+e)+'" y2="'+f(b)+'"/><line class="dim" x1="'+f(xx)+'" y1="'+f(a)+'" x2="'+f(xx)+'" y2="'+f(b)+'"/><line class="dim" x1="'+f(xx-4)+'" y1="'+f(a+4)+'" x2="'+f(xx+4)+'" y2="'+f(a-4)+'"/><line class="dim" x1="'+f(xx-4)+'" y1="'+f(b+4)+'" x2="'+f(xx+4)+'" y2="'+f(b-4)+'"/><text class="lbl" transform="translate('+f(tx)+','+f((a+b)/2)+') rotate(-90)" text-anchor="middle" style="fill:var(--muted)">'+esc(label)+'</text></g>');
  };
  o.pat=function(kind){
    var pid='sp'+id+'_'+kind;
    if(!have[kind]){
      have[kind]=1;
      if(kind==='hatch')defs.push('<pattern id="'+pid+'" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" class="pt-bg" fill="none"/><line x1="0" y1="0" x2="0" y2="7" class="pt-ln"/></pattern>');
      else if(kind==='mesh')defs.push('<pattern id="'+pid+'" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" class="pt-clear" fill="none"/><path d="M0 0H6M0 0V6" class="pt-ln"/></pattern>');
      else if(kind==='rope')defs.push('<pattern id="'+pid+'" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><rect width="6" height="6" class="pt-bg" fill="none"/><line x1="0" y1="0" x2="0" y2="6" class="pt-rope"/></pattern>');
      else defs.push('<pattern id="'+pid+'" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" class="pt-clear" fill="none"/><line x1="0" y1="0" x2="0" y2="8" class="pt-ac"/></pattern>');
    }
    return 'url(#'+pid+')';
  };
  o.svg=function(label){return '<svg viewBox="0 0 '+VW+' '+f(VH)+'" role="img" aria-label="'+esc(label||'Drawing')+'" xmlns="http://www.w3.org/2000/svg"><defs>'+defs.join('')+'</defs>'+out.join('')+'</svg>'};
  return o;
}
function rng(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

/* fields */
function defaultsOf(defs){var o={};defs.forEach(function(d){o[d.id]=d.type==='select'?d.v:d.v});return o}
function loadState(pid,defs){
  var s=defaultsOf(defs),sv=lsGet('proj_'+pid,null);
  if(sv&&typeof sv==='object'){
    defs.forEach(function(d){
      if(!(d.id in sv))return;
      if(d.type==='select'){if(d.options.some(function(o){return String(o[0])===String(sv[d.id])}))s[d.id]=String(sv[d.id])}
      else{var v=+sv[d.id];if(isFinite(v))s[d.id]=Math.min(d.max,Math.max(d.min,v))}
    });
  }
  defs.forEach(function(d){if(d.type==='select')s[d.id]=String(s[d.id])});
  return s;
}
function fieldHTML(pid,d,val){
  var id='f_'+pid+'_'+d.id,hint=d.hint?'<div class="hint">'+esc(d.hint)+'</div>':'';
  if(d.type==='select'){
    return '<div class="fld"><label for="'+id+'">'+esc(d.label)+'</label><select id="'+id+'" data-fld="'+d.id+'">'+d.options.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>'+hint+'</div>';
  }
  return '<div class="fld"><label for="'+id+'">'+esc(d.label)+'</label><div class="frow"><input type="range" id="'+id+'_r" data-fld="'+d.id+'" data-kind="r" min="'+d.min+'" max="'+d.max+'" step="'+d.step+'" value="'+val+'" aria-label="'+esc(d.label)+' slider"><span class="num"><input type="number" inputmode="decimal" id="'+id+'" data-fld="'+d.id+'" data-kind="n" min="'+d.min+'" max="'+d.max+'" step="'+d.step+'" value="'+val+'"><span class="unit">'+esc(d.unit||'')+'</span></span></div>'+hint+'</div>';
}
function fieldsHTML(pid,defs,state){return defs.map(function(d){return fieldHTML(pid,d,state[d.id])}).join('')}
function bindFields(root,pid,defs,state,onChange){
  root.addEventListener('input',function(e){
    var el=e.target,f=el.dataset&&el.dataset.fld;if(!f)return;
    var d=defs.filter(function(x){return x.id===f})[0];if(!d)return;
    if(d.type==='select')state[f]=String(el.value);
    else{
      var v=parseFloat(el.value);if(!isFinite(v))return;
      v=Math.min(d.max,Math.max(d.min,v));state[f]=v;
      var other=root.querySelector('#f_'+pid+'_'+f+(el.dataset.kind==='r'?'':'_r'));
      if(other)other.value=v;
      if(el.dataset.kind==='r'){var n=root.querySelector('#f_'+pid+'_'+f);if(n)n.value=v}
    }
    lsSet('proj_'+pid,state);onChange();
  });
  root.addEventListener('change',function(e){
    var el=e.target;if(!el.dataset||el.dataset.kind!=='n')return;
    var f=el.dataset.fld;if(f in state)el.value=state[f];
  });
}

/* shared small renderers */
function statHTML(s){return '<div class="stat"><div class="k">'+esc(s.k)+'</div><div class="v">'+esc(s.v)+'</div>'+(s.u?'<div class="u">'+esc(s.u)+'</div>':'')+'</div>'}
var MK={ok:'OK',warn:'Check',bad:'Fix',info:'Note'};
function checksHTML(cs){return '<ul class="checks">'+cs.map(function(c){return '<li><span class="mk '+c.lv+'">'+MK[c.lv]+'</span><span>'+esc(c.t)+'</span></li>'}).join('')+'</ul>'}
function buyHTML(buy){return '<ul class="buy">'+buy.map(function(b){return '<li><span class="q">'+esc(b.qty)+'</span><span>'+esc(b.text)+'</span><span class="src">'+esc(b.src)+'</span></li>'}).join('')+'</ul>'}
function cutsHTML(cuts){
  return '<div class="tw"><table><thead><tr><th>Part</th><th class="m r">Qty</th><th class="m">Length × Width × Thick (mm)</th><th>Material</th><th>Note</th></tr></thead><tbody>'+cuts.map(function(c){return '<tr><td>'+esc(c.part)+'</td><td class="m r">'+c.qty+'</td><td class="m">'+dims(c.l,c.w,c.t)+'</td><td>'+esc(c.mat)+'</td><td>'+esc(c.note||'')+'</td></tr>'}).join('')+'</tbody></table></div>';
}

/* ================= PROJECTS ================= */
var FORMATS=[['Mass-market paperback',178],['Trade paperback',216],['Hardback',245],['Large art book',300]];
function sel(v,l){return [v,l]}

/* ---- Bookshelf ---- */
var BOOK_DEFS=[
 {id:'cols',label:'Boxes across',unit:'',min:1,max:6,step:1,v:3},
 {id:'rows',label:'Boxes high',unit:'',min:1,max:6,step:1,v:3},
 {id:'W',label:'Box width',unit:'mm',min:250,max:1000,step:10,v:600},
 {id:'H',label:'Box height',unit:'mm',min:200,max:600,step:10,v:330},
 {id:'D',label:'Depth',unit:'mm',min:150,max:450,step:10,v:300,hint:'Includes the 6 mm back'},
 {id:'shelves',label:'Extra shelves per box',unit:'',min:0,max:3,step:1,v:0},
 {id:'t',type:'select',label:'Board thickness',options:[['18','18 mm'],['16','16 mm'],['12','12 mm']],v:'18'},
 {id:'mat',type:'select',label:'Material',options:[['ply','Plywood sheets 2400 × 1200'],['pine','Laminated pine panels 1800 long']],v:'ply'},
 {id:'crown',type:'select',label:'Crown moulding cap',options:[['yes','Yes'],['no','No']],v:'yes'}
];
function cBook(p){
  var cols=+p.cols,rows=+p.rows,W=+p.W,H=+p.H,D=+p.D,sh=+p.shelves,t=+p.t,ply=p.mat==='ply',crown=p.crown==='yes';
  var n=cols*rows,bt=6,d=D-bt,inner=W-2*t,mat=ply?'Plywood':'Laminated pine';
  var cuts=[
    {part:'Side',qty:2*n,l:H,w:d,t:t,mat:mat,note:'Grain runs along the length'},
    {part:'Top / bottom',qty:2*n,l:inner,w:d,t:t,mat:mat,note:'Pocket holes on the hidden faces'}
  ];
  if(sh>0)cuts.push({part:'Shelf',qty:sh*n,l:inner,w:d-10,t:t,mat:mat,note:'Set back 10 mm'});
  cuts.push({part:'Back',qty:n,l:W,w:H,t:bt,mat:'6 mm ply or MDF',note:'Glued and pinned'});
  var levels=sh+1,levelH=(H-2*t-sh*t)/levels,capacity=n*levels*Math.max(0,Math.floor(inner/28));
  var fits=FORMATS.filter(function(f){return f[1]+10<=levelH});
  var checks=[];
  var limit=(ply?800:700)*Math.pow(t/18,1.5);
  if(inner>limit)checks.push({lv:'bad',t:'The '+fmm(inner)+' mm shelf span will sag under books. Keep it under '+fmm(limit)+' mm, add a shelf upright or use thicker board.'});
  else if(inner>0.85*limit)checks.push({lv:'warn',t:'The '+fmm(inner)+' mm span is close to the sag limit of '+fmm(limit)+' mm. Books will bow it over time.'});
  else checks.push({lv:'ok',t:'The '+fmm(inner)+' mm shelf span is well inside the sag limit of '+fmm(limit)+' mm.'});
  if(rows*H>900)checks.push({lv:'warn',t:'Fit anti-tip brackets to the top row (books + a climbing cat). Total height is '+fmm(rows*H)+' mm.'});
  if(d<220)checks.push({lv:'warn',t:'Inside depth of '+fmm(d)+' mm is too shallow for hardbacks.'});
  if(fits.length)checks.push({lv:'ok',t:'Each level is '+fmm(levelH)+' mm tall inside. Fits: '+fits.map(function(f){return f[0].toLowerCase()+' ('+f[1]+' mm)'}).join(', ')+'.'});
  else checks.push({lv:'bad',t:'Each level is only '+fmm(levelH)+' mm tall inside, so no standard book fits. Make the box taller or drop a shelf.'});
  var plans=[],buy=[];
  var pcs=[{len:H,qty:2*n,label:'Side'},{len:inner,qty:2*n,label:'Top/bot'},{len:inner,qty:sh*n,label:'Shelf'}];
  var panelCount=0;
  if(ply){
    var bins=pack(pcs,2400),per=Math.max(1,Math.floor(1200/(d+3))),sheets=ce(bins.length/per);panelCount=sheets;
    plans.push({title:t+' mm plywood strips, '+fmm(d)+' mm wide',stock:2400,bins:bins,caption:'Each sheet gives '+per+' strips 2400 long at '+fmm(d)+' mm. Ask Bunnings’ panel saw to rip them. You need '+bins.length+' strips, so buy '+sheets+' sheet'+(sheets===1?'':'s')+'.'});
    buy.push({key:'panels',text:'Plywood sheet 2400 × 1200 × '+t+' mm (ripped to '+fmm(d)+' mm strips in store)',qty:String(sheets),src:'Bunnings'});
  }else{
    var pw=[300,400,450,600].filter(function(x){return x>=d})[0]||600;
    var bins2=pack(pcs,1800);panelCount=bins2.length;
    plans.push({title:'Laminated pine panels, '+pw+' wide × '+t+' thick',stock:1800,bins:bins2,caption:'Buy '+bins2.length+' panel'+(bins2.length===1?'':'s')+' 1800 long × '+pw+' wide. Cross-cut the parts along each panel, then trim to '+fmm(d)+' mm.'});
    buy.push({key:'panels',text:'Laminated pine panel 1800 × '+pw+' × '+t+' mm',qty:String(bins2.length),src:'Timber merchant'});
  }
  var perBack=Math.max(1,Math.max(Math.floor(2400/(W+3))*Math.floor(1200/(H+3)),Math.floor(2400/(H+3))*Math.floor(1200/(W+3))));
  var backSheets=ce(n/perBack);
  buy.push({key:'backs',text:'6 mm ply or MDF sheet 2400 × 1200 for backs ('+perBack+' backs per sheet)',qty:String(backSheets),src:'Bunnings'});
  var crownN=0;
  if(crown){
    var front=cols*W+80,side=D+40,cp;
    if(front>2400){
      checks.push({lv:'warn',t:'The crown front is '+fmm(front)+' mm, longer than 2400. It is split into two pieces with a scarf join over a box side.'});
      var half=ce(front/2)+50;
      cp=[{len:half,qty:2,label:'Front'},{len:side,qty:2,label:'Side'}];
      cuts.push({part:'Crown front',qty:2,l:half,w:67,t:19,mat:'Crown moulding',note:'Scarf join, overlap 100 mm'});
    }else{
      cp=[{len:front,qty:1,label:'Front'},{len:side,qty:2,label:'Side'}];
      cuts.push({part:'Crown front',qty:1,l:front,w:67,t:19,mat:'Crown moulding',note:'Mitre both ends'});
    }
    cuts.push({part:'Crown side',qty:2,l:side,w:67,t:19,mat:'Crown moulding',note:'Mitre front end'});
    var cb=pack(cp,2400);crownN=cb.length;

  }

function drawBook(c){

function getList(){var l=lsGet('list',[]);return Array.isArray(l)?l:[]}
function seedList(){
  if(lsHas('list'))return;
  var t=['Ryobi 18V hedge trimmer','Ryobi 18V line trimmer','Bypass loppers','Garden fork','Gardening gloves','Spade or mattock for digging out grass clumps'];
  sync.applying=true;
  lsSet('list',t.map(function(x){return {id:'tools:'+slug(x),text:x,qty:'1',src:'Bunnings',group:'tools',done:false}}));
  sync.applying=false;
}
function addGroup(group,items,label){
  var old=getList(),dm={};
  old.forEach(function(i){if(i.group===group)dm[i.id]=i.done});
  var rest=old.filter(function(i){return i.group!==group});
  var neu=items.map(function(b){var id=group+':'+(b.key||slug(b.text));return {id:id,text:b.text,qty:String(b.qty),src:b.src,group:group,done:!!dm[id]}});
  lsSet('list',rest.concat(neu));
  toast('Added '+neu.length+' items from '+label);
}
function listText(){
  var l=getList(),out=[];
  SOURCES.forEach(function(s){var g=l.filter(function(i){return i.src===s});if(!g.length)return;out.push(s);g.forEach(function(i){out.push((i.done?'[x] ':'[ ] ')+i.qty+'  '+i.text)});out.push('')});
  return out.join('\n').trim();
}

  var l=getList(),ticked=l.filter(function(i){return i.done}).length;
  var h='<div class="phead"><div class="eyebrow" style="color:var(--leaf)">Shopping</div><h1>Shopping list</h1><p>'+l.length+' items, '+ticked+' ticked. Project lists land here when you press Add to shopping list.</p></div>';
  h+='<div class="row" style="margin-bottom:22px"><button class="btn btn-primary" id="list_copy" data-act="copy">Copy list</button>';
  if(!clearConfirm)h+='<button class="btn" id="list_clear" data-act="clear1"'+(ticked?'':' disabled')+'>Clear ticked</button>';
  else h+='<span>Remove '+ticked+' ticked item'+(ticked===1?'':'s')+'?</span><button class="btn" id="list_clear_yes" data-act="clear2">Yes, remove</button><button class="btn" id="list_clear_no" data-act="clear0">Keep them</button>';
  h+='</div>';
  if(copyText!==null)h+='<div class="panel" style="margin-bottom:22px"><label for="list_copy_area" class="eyebrow">Select and copy</label><textarea id="list_copy_area" rows="8" readonly style="margin-top:8px;font:13px var(--mono)">'+esc(copyText)+'</textarea></div>';
  if(!l.length)h+='<p class="muted">Nothing here yet.</p>';
  SOURCES.forEach(function(s){
    var g=l.filter(function(i){return i.src===s});if(!g.length)return;
    h+='<div class="gl"><div class="eyebrow">'+esc(s)+'</div>'+g.map(function(i){
      return '<div class="li'+(i.done?' done':'')+'"><input type="checkbox" id="li_'+esc(i.id)+'" data-lid="'+esc(i.id)+'"'+(i.done?' checked':'')+' aria-label="Tick '+esc(i.text)+'"><span class="q">'+esc(i.qty)+'</span><span class="t">'+esc(i.text)+'</span><span>'+(i.group==='tools'?'<span class="starter">Starter</span> ':'')+'<span class="tag">'+esc(GROUP_LABEL[i.group]||i.group)+'</span></span><button class="btn-link" data-act="rm" data-id="'+esc(i.id)+'" aria-label="Remove '+esc(i.text)+'">Remove</button></div>';
    }).join('')+'</div>';
  });
  h+='<form class="panel addf" id="list_form" autocomplete="off"><div class="wide"><label for="list_item">Item</label><input id="list_item" type="text" required></div><div><label for="list_qty">Qty</label><input id="list_qty" type="text" value="1" class="mono"></div><div><label for="list_src">Source</label><select id="list_src">'+SOURCES.map(function(s){return '<option>'+s+'</option>'}).join('')+'</select></div><div class="wide"><button class="btn btn-primary" type="submit" id="list_add">Add item</button></div></form>';
  $('#page-list').innerHTML=h;
  refocus(focusSel);

/* ---- events ---- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,p=b.dataset.p;
  if(a==='reset'){
    var defs=p==='bed'?BED_ALL:PROJ[p].defs;
    ST[p]=defaultsOf(defs);lsSet('proj_'+p,ST[p]);
    var c=$('#ctl_'+p);
    /* rebind state: handlers hold the old object, so rebuild the controls element */
    var nc=c.cloneNode(false);c.parentNode.replaceChild(nc,c);
    nc.innerHTML=p==='bed'?ctlInner('bed',BED_DEFS,BED_PRICE_DEFS):ctlInner(p,PROJ[p].defs);
    bindFields(nc,p,defs,ST[p],function(){updateOut(p)});
    updateOut(p);refocus('#reset_'+p);
  }else if(a==='addlist'){
    var m=MD[p];if(!m)return;
    addGroup(p==='bed'?'bed':PROJ[p].group,m.buy,p==='bed'?'the driveway bed':PROJ[p].name);
  }else if(a==='wtab'){lsSet('wtab',p);renderWorkshop();refocus('#wt_'+p)}
  else if(a==='openproj'){lsSet('wtab',p);if(location.hash==='#workshop')route();else location.hash='workshop'}
  else if(a==='rm'){var id=b.dataset.id;lsSet('list',getList().filter(function(i){return i.id!==id}));renderList('#list_copy')}
  else if(a==='copy'){
    var txt=listText();
    var fallback=function(){copyText=txt;renderList('#list_copy_area');var ta=$('#list_copy_area');if(ta){ta.focus();ta.select()}toast('Select the text and copy it')};
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('List copied')},fallback);
      else fallback();
    }catch(err){fallback()}
  }
  else if(a==='clear1'){clearConfirm=true;renderList('#list_clear_no')}
  else if(a==='clear0'){clearConfirm=false;renderList('#list_clear')}
  else if(a==='clear2'){clearConfirm=false;lsSet('list',getList().filter(function(i){return !i.done}));renderList('#list_copy');toast('Ticked items removed')}
});
document.addEventListener('change',function(e){
  var el=e.target,d=el.dataset||{};
  if(d.task){
    var t=getTasks();if(el.checked)t[d.task]=true;else delete t[d.task];lsSet('tasks',t);
    var cur=(location.hash||'#today').replace('#','');
    if(cur==='garden'){$('#g-phases').innerHTML=phasesHTML();refocus('[data-task="'+d.task+'"]')}
    else{renderToday();refocus('#up_task')}
  }else if(d.built){
    var bt=getBuilt();if(el.checked)bt[d.built]=true;else delete bt[d.built];lsSet('built',bt);
    renderToday();refocus('#built_'+d.built);
  }else if(d.lid){
    lsSet('list',getList().map(function(i){if(i.id===d.lid)i.done=el.checked;return i}));
    clearConfirm=false;renderList('[data-lid="'+d.lid+'"]');
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='list_form')return;
  e.preventDefault();
  var txt=$('#list_item').value.trim();if(!txt)return;
  var l=getList();
  l.push({id:'manual:'+Date.now().toString(36)+Math.floor(Math.random()*1e4),text:txt,qty:$('#list_qty').value.trim()||'1',src:$('#list_src').value,group:'manual',done:false});
  lsSet('list',l);renderList('#list_item');toast('Added '+txt);
});


/* ================= Google Sheet sync ================= */
var SHEET_ID='1S5kGsM0CJkQQGEvisQMZDhrfdCosY025MqKxtej9Rvc';
var GROUP_NAME={bed:'Driveway bed',bookshelf:'Bookshelf',perch:'Cat perch',catio:'Catio pod',cabinet:'Display cabinet',tools:'Garden starter kit',manual:'Mine'};
var PROJ_KEYS=['bed'].concat(PROJ_ORDER);
var RANGES={tasks:'Tasks!A2:E',list:'List!A2:G',projects:'Projects!A2:D'};
var TABNAME={tasks:'Tasks',list:'List',projects:'Projects'};
var WIDTH={tasks:5,list:7,projects:4};
var sync={tr:null,kind:'none',connected:false,busy:false,again:false,err:false,last:0,timer:null,known:{tasks:0,list:0,projects:0},ver:{tasks:0,list:0,projects:0},applying:false,headerDone:false,seen:{}};
try{sync.last=+localStorage.getItem('ss_lastsync')||0}catch(e){}
function lsRaw(k){try{return JSON.parse(localStorage.getItem('ss_'+k)||'null')}catch(e){return null}}
function lsRawSet(k,v){try{localStorage.setItem('ss_'+k,JSON.stringify(v))}catch(e){}}
function getDirty(){var d=lsRaw('dirty');return d&&typeof d==='object'?d:{}}
function setDirty(d){lsRawSet('dirty',d)}
function anyDirty(){var d=getDirty();return !!(d.tasks||d.list||d.projects)}
function tabOfKey(k){return k==='tasks'?'tasks':k==='list'?'list':(k==='built'||k.indexOf('proj_')===0)?'projects':null}
syncHook=function(k){
  if(sync.applying)return;
  var t=tabOfKey(k);if(!t)return;
  var d=getDirty();d[t]=1;setDirty(d);sync.ver[t]++;
  if(sync.connected){clearTimeout(sync.timer);sync.timer=setTimeout(function(){flush()},1500)}
  paintSync();
};
function truthy(v){if(v===true)return true;var s=String(v==null?'':v).trim().toLowerCase();return s==='true'||s==='yes'||s==='1'||s==='y'}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function normDate(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'&&isFinite(v))return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  var s=String(v).trim(),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  return s;
}
function cell(r,i){return r&&r[i]!=null?r[i]:''}

/* build rows from local state */
function tasksRows(){
  var t=getTasks(),dates=lsRaw('taskdates')||{},ch=false;
  var rows=ALLTASKS.map(function(x){
    var done=!!t[x.id],on='';
    if(done){on=dates[x.id]||'';if(!on){on=dates[x.id]=todayISO();ch=true}}
    else if(dates[x.id]){delete dates[x.id];ch=true}
    return [x.id,x.text,x.phase.name,done,on];
  });
  if(ch)lsRawSet('taskdates',dates);
  return rows;
}
function listRows(){
  return getList().map(function(i){return [i.id,i.text,i.qty,i.src,GROUP_NAME[i.group]||i.group,!!i.done,i.group]});
}
function projectsRows(){
  var rows=[],today=todayISO();
  function add(key,obj,note){
    var v=JSON.stringify(obj),s=sync.seen[key];
    var u=(s&&s.v===v)?s.u:today;sync.seen[key]={v:v,u:u};
    rows.push([key,v,u,note]);
  }
  add('built',getBuilt(),'Woodwork path progress');
  PROJ_KEYS.forEach(function(p){
    var defs=p==='bed'?BED_ALL:PROJ[p].defs;
    add('proj_'+p,loadState(p,defs),(p==='bed'?'Driveway bed planner':PROJ[p].name)+' settings');
  });
  return rows;
}
var BUILD={tasks:tasksRows,list:listRows,projects:projectsRows};

/* transports */
var google_={
  cfgKey:'ss_gconfig',tokKey:'ss_gtoken',client:null,
  cfg(){try{return JSON.parse(localStorage.getItem(this.cfgKey)||'null')||{}}catch(e){return {}}},
  saveCfg(c){try{localStorage.setItem(this.cfgKey,JSON.stringify({...this.cfg(),...c}))}catch(e){}},
  tok(){try{return JSON.parse(localStorage.getItem(this.tokKey)||'null')}catch(e){return null}},
  valid(){const t=this.tok();return !!(t&&t.exp>Date.now())},
  async callTool(server,tool,input){
    if(!this.valid()){googleSignedOut();throw {code:'google_signin'}}
    const base=`https://sheets.googleapis.com/v4/spreadsheets/${input.spreadsheetId}/values/${encodeURIComponent(input.range)}`;
    const url=tool==='get_values'?base:tool==='append_values'?base+':append?valueInputOption=USER_ENTERED':base+'?valueInputOption=USER_ENTERED';
    const opts={method:tool==='get_values'?'GET':tool==='append_values'?'POST':'PUT',headers:{Authorization:'Bearer '+this.tok().t}};
    if(tool!=='get_values'){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify({values:input.values})}
    const res=await fetch(url,opts);
    if(res.status===401){try{localStorage.removeItem(this.tokKey)}catch(e){}googleSignedOut();throw {code:'google_signin'}}
    const body=await res.json().catch(()=>({}));
    if(!res.ok)throw {code:'tool_error',message:(body.error&&body.error.message)||'HTTP '+res.status};
    return {payload:body};
  }
};
function framedByClaude(){
  try{if(window.self===window.top)return false}catch(e){return true}
  try{var ao=window.location.ancestorOrigins;if(ao&&ao.length){for(var i=0;i<ao.length;i++)if(/claude\.(ai|com)|anthropic\.com/.test(ao[i]))return true}}catch(e){}
  return /claude\.(ai|com)|anthropic\.com/.test(document.referrer||'');
}
async function pickTransport(){
  if(window.claude&&window.claude.use){
    var mcp=null;try{mcp=await window.claude.use('mcp')}catch(e){}
    if(mcp)return {kind:'claude',callTool:function(s,t,i){return t==='get_values'?mcp.callTool(s,t,i,{cache:false}):mcp.callTool(s,t,i)}};
  }
  if(framedByClaude())return {kind:'none'};
  return {kind:'google',callTool:function(s,t,i){return google_.callTool(s,t,i)}};
}
var gisP=null;
function loadGis(){
  if(window.google&&window.google.accounts&&window.google.accounts.oauth2)return Promise.resolve();
  if(gisP)return gisP;
  gisP=new Promise(function(res,rej){
    var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
    s.onload=function(){res()};s.onerror=function(){gisP=null;rej(new Error('load'))};
    document.head.appendChild(s);
  });
  return gisP;
}
function googleSignedOut(){sync.connected=false;paintSync()}
function openClientDialog(){
  var d=$('#gdlg');if(!d)return;
  $('#gcid').value=google_.cfg().clientId||'';$('#gerr').textContent='';
  if(d.showModal)d.showModal();else d.setAttribute('open','');
  setTimeout(function(){try{$('#gcid').focus()}catch(e){}},0);
}
function googleConnect(){
  var cid=google_.cfg().clientId;
  if(!cid){openClientDialog();return}
  if(!(window.google&&window.google.accounts&&window.google.accounts.oauth2)){
    loadGis().then(function(){showNote('Google sign-in is ready. Press Connect again.')},function(){showNote('Could not load Google sign-in. Check your connection and try again.')});
    return;
  }
  var tc=google.accounts.oauth2.initTokenClient({
    client_id:cid,scope:'https://www.googleapis.com/auth/spreadsheets',
    callback:function(r){
      if(!r||r.error||!r.access_token){showNote('Google sign-in was not completed'+(r&&r.error?' ('+r.error+')':'')+'.');return}
      try{localStorage.setItem(google_.tokKey,JSON.stringify({t:r.access_token,exp:Date.now()+(r.expires_in-120)*1000}))}catch(e){}
      sync.connected=true;hideNote();syncAll();
    },
    error_callback:function(e){showNote('Google sign-in was closed or blocked'+(e&&e.type?' ('+e.type+')':'')+'. Allow pop-ups for this page and try again.')}
  });
  tc.requestAccessToken({prompt:''});
}

/* status UI */
function ago(ts){
  var m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return 'just now';if(m<60)return m+' min ago';
  var h=Math.floor(m/60);if(h<24)return h+' h ago';return Math.floor(h/24)+' d ago';
}
function showNote(msg){var n=$('#syncnote');if(!n)return;n.innerHTML='<div class="note" role="alert"><span>'+esc(msg)+'</span><button type="button" data-sync="dismiss">Dismiss</button></div>'}
function hideNote(){var n=$('#syncnote');if(n)n.innerHTML=''}
function paintSync(){
  var el=$('#sync');if(!el)return;
  var s,txt,btn='',dirty=anyDirty();
  if(sync.kind==='none'){s='off';txt='Saved on this device only'}
  else if(typeof navigator!=='undefined'&&navigator.onLine===false){s='off';txt='Offline: saved on this device'; if(sync.connected)btn=''}
  else if(!sync.connected){s='off';txt='Not connected';btn='Connect'}
  else if(sync.busy){s='busy';txt='Syncing…'}
  else if(sync.err){s='err';txt='Not synced';btn='Sync now'}
  else if(dirty){s='busy';txt='Changes waiting to sync';btn='Sync now'}
  else{s='ok';txt=sync.last?'Synced '+ago(sync.last):'Connected';btn='Refresh'}
  el.dataset.s=s;
  el.innerHTML='<span class="sd" aria-hidden="true"></span><span id="sync_txt">'+esc(txt)+'</span>'+(btn&&!sync.busy?'<button type="button" class="btn" id="sync_btn" data-sync="go">'+btn+'</button>':'');
  window.ssSync={state:s,text:txt,kind:sync.kind,connected:sync.connected,dirty:getDirty(),known:sync.known};
}
function friendly(e){
  var c=e&&e.code,m=e&&e.message;
  if(c==='google_signin')return 'Your Google sign-in has expired. Press Connect to sign in again. Your changes are kept on this device.';
  if(c==='not_granted'||c==='approval_required'||c==='consent_required')return 'Google Sheets access has not been allowed for this page. Press Connect and approve the request when claude.ai asks.';
  if(c==='server_not_connected'||c==='needs_reauth')return 'Google Sheets is not connected in claude.ai. Connect it in your claude.ai connectors, then press Connect. Your changes are kept on this device.';
  if(c==='blocked_by_policy')return 'Your organisation blocks the Google Sheets connector.';
  if(c==='rate_limited')return 'Google Sheets is rate limiting requests. Wait a minute, then press Sync now.';
  if(c==='tool_error')return 'Google Sheets reported a problem: '+(m||'unknown error')+'. Check that the Tasks, List and Projects tabs exist.';
  if(!c&&e instanceof TypeError)return 'Could not reach Google Sheets. You may be offline. Your changes are kept on this device and will sync later.';
  return 'Sync failed'+(m?': '+m:'')+'. Your changes are kept on this device. Press Sync now to retry.';
}
function authLost(e){var c=e&&e.code;return c==='google_signin'||c==='not_granted'||c==='approval_required'||c==='consent_required'||c==='server_not_connected'||c==='needs_reauth'||c==='blocked_by_policy'}
function fail(e){
  sync.err=true;
  if(authLost(e))sync.connected=false;
  showNote(friendly(e));paintSync();
}

/* sheet io */
async function getRows(tab){
  var r=await sync.tr.callTool('Google Sheets','get_values',{spreadsheetId:SHEET_ID,range:RANGES[tab]});
  var v=r&&r.payload&&r.payload.values;
  return Array.isArray(v)?v.filter(function(row){return Array.isArray(row)&&row.some(function(c){return c!==''&&c!=null})}):[];
}
async function pushTab(tab){
  var rows=BUILD[tab](),n=rows.length,total=Math.max(n,sync.known[tab]||0);
  var v0=sync.ver[tab];
  if(total>0){
    var out=rows.slice();
    while(out.length<total){var pad=[];for(var i=0;i<WIDTH[tab];i++)pad.push('');out.push(pad)}
    var last=String.fromCharCode(64+WIDTH[tab]);
    await sync.tr.callTool('Google Sheets','update_values',{spreadsheetId:SHEET_ID,range:TABNAME[tab]+'!A2:'+last+(total+1),values:out});
    if(tab==='list'&&!sync.headerDone){
      await sync.tr.callTool('Google Sheets','update_values',{spreadsheetId:SHEET_ID,range:'List!G1',values:[['group']]});
      sync.headerDone=true;
    }
  }
  sync.known[tab]=n;
  if(sync.ver[tab]===v0){var d=getDirty();delete d[tab];setDirty(d)}
  else{clearTimeout(sync.timer);sync.timer=setTimeout(function(){flush()},1500)}
}

/* apply pulled rows; returns true if local data changed */
function applyTasks(rows){
  var t=Object.assign({},getTasks()),dates=lsRaw('taskdates')||{},known={};
  ALLTASKS.forEach(function(x){known[x.id]=1});
  rows.forEach(function(r){
    var id=String(cell(r,0)).trim();if(!known[id])return;
    if(truthy(cell(r,3))){t[id]=true;dates[id]=normDate(cell(r,4))||dates[id]||todayISO()}
    else{delete t[id];delete dates[id]}
  });
  lsRawSet('taskdates',dates);
  return setIfChanged('tasks',t);
}
function applyList(rows){
  var rev={};Object.keys(GROUP_NAME).forEach(function(k){rev[GROUP_NAME[k].toLowerCase()]=k});
  var seen={},out=[];
  rows.forEach(function(r){
    var text=String(cell(r,1)).trim(),id=String(cell(r,0)).trim();
    if(!text&&!id)return;
    var proj=String(cell(r,4)).trim(),g=String(cell(r,6)).trim()||rev[proj.toLowerCase()]||'manual';
    if(!id)id=g+':'+slug(text);
    while(seen[id])id+='-2';seen[id]=1;
    var src=String(cell(r,3)).trim();if(SOURCES.indexOf(src)<0)src='Other';
    out.push({id:id,text:text||id,qty:String(cell(r,2)!==''?cell(r,2):'1'),src:src,group:g,done:truthy(cell(r,5))});
  });
  return setIfChanged('list',out);
}
function applyProjects(rows){
  var ch=false;
  rows.forEach(function(r){
    var key=String(cell(r,0)).trim(),obj=null;
    var ok=key==='built'||(key.indexOf('proj_')===0&&PROJ_KEYS.indexOf(key.slice(5))>=0);
    if(!ok)return;
    try{obj=JSON.parse(String(cell(r,1)))}catch(e){return}
    if(!obj||typeof obj!=='object'||Array.isArray(obj))return;
    sync.seen[key]={v:JSON.stringify(obj),u:normDate(cell(r,2))||todayISO()};
    if(setIfChanged(key,obj))ch=true;
  });
  return ch;
}
function setIfChanged(k,v){
  var cur=lsGet(k,null);
  if(JSON.stringify(cur)===JSON.stringify(v))return false;
  sync.applying=true;try{lsSet(k,v)}finally{sync.applying=false}
  return true;
}
var APPLY={tasks:applyTasks,list:applyList,projects:applyProjects};

function rerender(){
  var h=(location.hash||'').replace(/^#/,'');if(PAGES.indexOf(h)<0)h='today';
  var ae=document.activeElement;
  if(ae&&ae.type==='range')return; /* never yank a slider mid-drag */
  var y=window.scrollY;
  try{RENDER[h]()}catch(e){}
  window.scrollTo(0,y);
}

async function syncAll(){
  if(!sync.tr||sync.tr.kind==='none'||!sync.connected)return;
  if(sync.busy){sync.again=true;return}
  sync.busy=true;sync.err=false;paintSync();
  clearTimeout(sync.timer);
  try{
    var tabs=['tasks','list','projects'];
    var pulled=await Promise.all(tabs.map(getRows));
    var changed=false;
    for(var i=0;i<tabs.length;i++){
      var tab=tabs[i],rows=pulled[i],dirty=getDirty()[tab];
      sync.known[tab]=rows.length;
      if(dirty||rows.length===0){await pushTab(tab)}   /* local edits pending, or empty tab: seed */
      else if(APPLY[tab](rows))changed=true;
    }
    sync.pulledOnce=true;
    sync.last=Date.now();try{localStorage.setItem('ss_lastsync',String(sync.last))}catch(e){}
    hideNote();
    if(changed)rerender();
  }catch(e){fail(e)}
  sync.busy=false;paintSync();
  if(sync.again){sync.again=false;flush()}
}
async function flush(){
  if(!sync.tr||!sync.connected)return;
  if(sync.busy){sync.again=true;return}
  var d=getDirty(),tabs=['tasks','list','projects'].filter(function(t){return d[t]});
  if(!tabs.length)return;
  /* a never-pulled session must pull first so we do not overwrite sheet edits */
  if(!sync.pulledOnce){return syncAll()}
  sync.busy=true;sync.err=false;paintSync();
  try{
    for(var i=0;i<tabs.length;i++)await pushTab(tabs[i]);
    sync.last=Date.now();try{localStorage.setItem('ss_lastsync',String(sync.last))}catch(e){}
    hideNote();
  }catch(e){fail(e)}
  sync.busy=false;paintSync();
  if(sync.again){sync.again=false;flush()}
}

function syncUI(){
  var hd=$('.top');
  hd.insertAdjacentHTML('beforeend','<div class="sync" id="sync" role="status" aria-live="polite" data-s="off"></div>');
  $('.top').insertAdjacentHTML('afterend','<div id="syncnote"></div>');
  document.body.insertAdjacentHTML('beforeend','<dialog class="gd" id="gdlg"><form method="dialog" id="gform"><h3>Connect Google Sheets</h3><p class="muted" style="font-size:13.5px">Paste your Google OAuth Client ID (ends in .apps.googleusercontent.com). It is saved in this browser only.</p><label for="gcid" class="eyebrow">OAuth Client ID</label><input id="gcid" type="text" autocomplete="off" spellcheck="false"><div id="gerr" class="hint" style="color:var(--bad)"></div><div class="row"><button type="button" class="btn" id="gcancel">Cancel</button><button type="submit" class="btn btn-primary" id="gsave">Save and connect</button></div></form></dialog>');
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-sync]');if(!b)return;
    var a=b.dataset.sync;
    if(a==='dismiss')hideNote();
    else if(a==='go'){
      if(!sync.connected){if(sync.kind==='google')googleConnect();else if(sync.kind==='claude')connectClaude()}
      else syncAll();
    }
  });
  $('#gcancel').addEventListener('click',function(){$('#gdlg').close()});
  $('#gform').addEventListener('submit',function(e){
    e.preventDefault();
    var v=$('#gcid').value.trim();
    if(!/^[^\s]+\.apps\.googleusercontent\.com$/.test(v)){$('#gerr').textContent='That does not look like a Client ID. It should end with .apps.googleusercontent.com.';return}
    google_.saveCfg({clientId:v});$('#gdlg').close();googleConnect();
  });
  window.addEventListener('online',function(){paintSync();if(sync.connected&&anyDirty())flush()});
  window.addEventListener('offline',paintSync);
  setInterval(function(){if(!sync.busy)paintSync()},30000);
  paintSync();
}
async function connectClaude(){
  sync.connected=true;await syncAll();
}
async function syncInit(){
  syncUI();
  try{sync.tr=await pickTransport()}catch(e){sync.tr={kind:'none'}}
  sync.kind=sync.tr.kind;
  if(sync.kind==='claude'){sync.connected=true}
  else if(sync.kind==='google'){sync.connected=google_.valid();loadGis().catch(function(){})}
  paintSync();
  if(sync.connected)await syncAll();
}

/* ---- routing ---- */
var curPage=null,RENDER={today:renderToday,garden:renderGarden,workshop:renderWorkshop,list:function(){renderList()}};
function route(){
  var h=(location.hash||'').replace(/^#/,'');if(PAGES.indexOf(h)<0)h='today';
  PAGES.forEach(function(p){
    $('#page-'+p).hidden=p!==h;
    var tab=$('#tab-'+p);tab.setAttribute('aria-selected',p===h?'true':'false');
  });
  RENDER[h]();
  if(curPage!==h){window.scrollTo(0,0);curPage=h}
}
function init(){
  var now=new Date(),m=now.getMonth(),s=seasonOf(m);
  document.documentElement.dataset.season=s;
  $('#chip').innerHTML=MONTHS[m]+' · Ballarat · <b>'+s+'</b>';
  seedList();
  window.addEventListener('hashchange',route);
  route();
}
init();
syncInit();
})();
